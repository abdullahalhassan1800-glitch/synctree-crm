services:
  - type: web
    name: synctree-crm
    runtime: node
    repo: https://github.com/abdullahalhassan1800-glitch/synctree-crm.git
    plan: free
    region: singapore
    branch: main
    buildCommand: cd server && npm install
    startCommand: cd server && node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://synctree-crm.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: UPLOAD_DIR
        value: uploads
